name: wiki-check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check links
        run: python3 scripts/wiki/check_links.py

      - name: Check references
        run: python3 scripts/wiki/check_references.py

      - name: Check index
        run: python3 scripts/wiki/check_index.py
