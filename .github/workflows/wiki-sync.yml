# Verified 2026-10-22: anthropics/claude-code-action@v1 is the current GA
# major-version tag per code.claude.com/docs/en/github-actions. Re-check if
# this file is reused much later.

name: wiki-sync

on:
  push:
    branches: [main]
    paths-ignore:
      - "wiki/**"
      - ".claude/**"
      - "scripts/wiki/**"
      - ".github/workflows/wiki-*.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: wiki-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Determine changed range
        id: range
        run: echo "range=${{ github.event.before }}..${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code wiki-sync skill
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Run the /wiki-sync skill for commit range ${{ steps.range.outputs.range }}.
            Only modify files under wiki/, knowledge/README.md, knowledge/raw/README.md,
            and scripts/wiki/**. Do not touch application code, tests, or infrastructure.
            Follow the wiki-maintainer agent's authority hierarchy and traceability rules.

      - name: Validate wiki
        run: |
          python3 scripts/wiki/check_links.py
          python3 scripts/wiki/check_references.py
          python3 scripts/wiki/check_index.py

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- wiki/ knowledge/README.md knowledge/raw/README.md scripts/wiki/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/wiki-sync-${{ github.run_id }}
          commit-message: "docs(wiki): synchronize project knowledge"
          title: "docs: automatic project wiki synchronization"
          body: |
            Automated wiki synchronization for commit range `${{ steps.range.outputs.range }}`.

            Generated by the `wiki-sync` skill. Review the diff under `wiki/` before merging.
          labels: |
            documentation
            automated-wiki-sync
          add-paths: |
            wiki/**
            knowledge/README.md
            knowledge/raw/README.md
            scripts/wiki/**
